name: Versión

# PR develop → main: comenta qué versión se publicará y su changelog.
# Push a main (PR mergeado): crea el tag y el GitHub Release, y despliega el sitio.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vista-previa:
    name: Vista previa de la versión
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular la versión
        run: node scripts/release.mjs preview > release-preview.md

      - name: Comentar en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- vista-previa-version -->';
            const body = `${marker}\n## Versión\n\n${fs.readFileSync('release-preview.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  publicar:
    name: Publicar versión
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear tag y GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish

  desplegar:
    name: Desplegar en Cloudflare
    needs: publicar
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        # Toma la versión de pnpm del campo packageManager de package.json.
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El build lee los GitHub Releases para la página /changelog.
      - name: Generar el sitio
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      - name: Publicar en Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4 deploy
